<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">David — BMW E46 inspired profile banner</title>
  <desc id="desc">A restrained graphite banner with a fine-line side profile of a classic E46 coupe and minimal engineering typography.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d22"/>
      <stop offset="0.58" stop-color="#101519"/>
      <stop offset="1" stop-color="#0b0f12"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202930"/>
      <stop offset="1" stop-color="#11171b"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a5b7c1" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f83ad" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#65b2dc"/>
      <stop offset="1" stop-color="#3f83ad" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="440" fill="url(#background)"/>
  <rect width="1440" height="440" fill="url(#grid)"/>
  <path d="M0 365H1440" stroke="#d4dce0" stroke-width="1" opacity="0.12"/>
  <path d="M0 0H1440" stroke="#6bb4dc" stroke-width="3" opacity="0.8"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="84" y="94" fill="#83b9d8" font-size="13" letter-spacing="4">PERSONAL / ENGINEERING</text>
    <text x="80" y="190" fill="#f0f2f3" font-size="68" font-weight="600" letter-spacing="2">DAVID</text>
    <text x="84" y="232" fill="#c1cbd1" font-size="15" letter-spacing="3">AI  ·  ALGORITHMS  ·  SYSTEMS</text>
    <path d="M84 258H148" stroke="#6bb4dc" stroke-width="3"/>
    <text x="84" y="294" fill="#d6dde1" font-size="16">Build useful things.</text>
    <text x="84" y="319" fill="#8f9da5" font-size="14">Make complexity feel simple.</text>
    <text x="84" y="391" fill="#7e8b92" font-size="10" letter-spacing="2.5">SCIENTIFIC COMPUTING / SOFTWARE ENGINEERING</text>
  </g>

